<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jenkins Build Party & CI/CD Lounge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    /* Jenkins Character Area */
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin: 16px 0 24px;
      cursor: pointer;
    }

    .speech-bubble {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #0f172a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent;
    }

    .speech-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    .jenkins-svg {
      width: 140px;
      height: 140px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
    }

    /* Dance Animations */
    .dance-wiggle {
      animation: wiggle 0.4s infinite ease-in-out alternate;
    }
    .dance-breakdance {
      animation: spinBounce 0.6s infinite linear;
    }
    .dance-disco {
      animation: discoFlail 0.5s infinite ease-in-out alternate;
    }

    @keyframes wiggle {
      0% { transform: rotate(-16deg) scale(1.1) translateY(-10px); }
      100% { transform: rotate(16deg) scale(1.1) translateY(10px); }
    }

    @keyframes spinBounce {
      0% { transform: rotate(0deg) scale(1) translateY(0); }
      50% { transform: rotate(180deg) scale(1.25) translateY(-30px); }
      100% { transform: rotate(360deg) scale(1) translateY(0); }
    }

    @keyframes discoFlail {
      0% { transform: skewX(-15deg) rotate(-10deg) scale(1.15); }
      50% { transform: skewX(15deg) rotate(10deg) scale(0.9); }
      100% { transform: skewX(-15deg) rotate(-10deg) scale(1.15); }
    }

    /* Stats Banner */
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .score-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 18px;
    }

    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .score-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* Controls Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    button span {
      font-size: 1.3rem;
    }

    button:hover {
      transform: translateY(-2px);
      background: #475569;
    }

    button:active {
      transform: translateY(1px);
    }

    button.active-dance {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }

    .console-feed {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      text-align: left;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #4ade80;
      height: 70px;
      overflow-y: hidden;
      display: flex;
      align-items: center;
    }

    /* Floating visual effects */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: floatUp 1.5s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.4) rotate(45deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Butler's Pipeline Arcade</h1>
    <p class="subtitle">Click Mr. Jenkins or mash the stage buttons below!</p>

    <div class="avatar-wrapper" id="avatarArea" onclick="triggerPoke(event)">
      <div class="speech-bubble" id="bubble">Click me again!</div>
      
      <!-- Vector Jenkins Graphic -->
      <svg class="jenkins-svg" id="jenkins" viewBox="0 0 100 100">
        <!-- Body -->
        <circle cx="50" cy="50" r="42" fill="#D33833" />
        <circle cx="50" cy="50" r="38" fill="#F0F4F8" />
        <!-- Face Features -->
        <circle cx="42" cy="45" r="4" fill="#20232A" />
        <circle cx="58" cy="45" r="4" fill="#20232A" />
        <path d="M 40 60 Q 50 72 60 60" stroke="#20232A" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Bowtie & Mustache -->
        <path d="M 40 52 Q 50 50 60 52 Q 50 56 40 52" fill="#20232A" />
        <polygon points="43,76 57,76 50,81" fill="#D33833" />
        <!-- Waiter Hat / Cap -->
        <path d="M 32 26 C 32 15, 68 15, 68 26 Z" fill="#20232A"/>
        <line x1="28" y1="26" x2="72" y2="26" stroke="#20232A" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="scoreboard">
      <div class="score-card">
        <div class="score-label">Deploy Mood</div>
        <div class="score-value" id="moodVal">CHILL</div>
      </div>
      <div class="score-card">
        <div class="score-label">Successful Grooves</div>
        <div class="score-value" id="grooveVal">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Build Status</div>
        <div class="score-value" style="color: var(--accent-green);">STABLE (99.9%)</div>
      </div>
    </div>

    <div class="actions-grid">
      <button onclick="setDance('dance-wiggle', 'Pipeline Wobble', 'Deploying to staging with style!')">
        <span>🕺</span> Staging Jig
      </button>
      <button onclick="setDance('dance-breakdance', 'Prod Spin', 'Breaking prod on purpose!')">
        <span>🌀</span> Breakdance
      </button>
      <button onclick="setDance('dance-disco', 'Approval Disco', 'Manager approved the grooves!')">
        <span>🪩</span> Disco Fix
      </button>
      <button onclick="triggerSuccess()">
        <span>🎉</span> Trigger 200 OK
      </button>
    </div>

    <div class="console-feed" id="console">
      [INFO] Agent idle. Click Mr. Jenkins to trigger manual build pipeline...
    </div>
  </div>

  <script>
    const jenkins = document.getElementById('jenkins');
    const bubble = document.getElementById('bubble');
    const consoleLog = document.getElementById('console');
    const moodVal = document.getElementById('moodVal');
    const grooveVal = document.getElementById('grooveVal');
    
    let danceCount = 0;
    let currentDance = '';

    const quotes = [
      "Pipeline green! Keep grooving!",
      "Deploying straight to production on a Friday!",
      "Zero failed stages detected!",
      "Who needs unit tests when you have moves?",
      "Rolling back? Never heard of her.",
      "100% build cache hit rate!"
    ];

    const particles = ['🚀', '🔥', '⚡', '🎉', '💃', '☕', '📦', '🟢'];

    function showBubble(text) {
      bubble.textContent = text;
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 2200);
    }

    function log(msg) {
      consoleLog.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function spawnParticle(x, y, icon) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = icon || particles[Math.floor(Math.random() * particles.length)];
      el.style.left = `${x - 15}px`;
      el.style.top = `${y - 15}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    function triggerPoke(e) {
      danceCount++;
      grooveVal.textContent = danceCount;

      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      showBubble(randomQuote);
      log(`Triggered manual webhook: ${randomQuote}`);

      spawnParticle(e.clientX, e.clientY);

      // Give a tiny bounce if no full dance is running
      if (!currentDance) {
        jenkins.style.transform = 'scale(1.2) rotate(' + (Math.random() > 0.5 ? 15 : -15) + 'deg)';
        setTimeout(() => {
          if (!currentDance) jenkins.style.transform = 'scale(1) rotate(0deg)';
        }, 200);
      }
    }

    function setDance(className, mood, logText) {
      jenkins.classList.remove('dance-wiggle', 'dance-breakdance', 'dance-disco');
      
      if (currentDance === className) {
        currentDance = '';
        moodVal.textContent = 'CHILL';
        log("Pipeline execution finished. Agent idle.");
        return;
      }

      currentDance = className;
      jenkins.classList.add(className);
      moodVal.textContent = mood.toUpperCase();
      log(logText);

      danceCount += 2;
      grooveVal.textContent = danceCount;

      const rect = jenkins.getBoundingClientRect();
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          spawnParticle(
            rect.left + rect.width / 2 + (Math.random() * 40 - 20),
            rect.top + rect.height / 2 + (Math.random() * 40 - 20)
          );
        }, i * 150);
      }
    }

    function triggerSuccess() {
      showBubble("✨ 0 ERRORS! DEPLOYED! ✨");
      log("BUILD SUCCESSFUL: Artifacts deployed to testing & production!");
      
      const rect = jenkins.getBoundingClientRect();
      for (let i = 0; i < 15; i++) {
        setTimeout(() => {
          spawnParticle(
            rect.left + Math.random() * rect.width,
            rect.top + Math.random() * rect.height,
            '🎉'
          );
        }, i * 60);
      }
    }
  </script>
</body>
</html>
